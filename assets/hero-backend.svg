<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 320" role="presentation" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080c11" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#080c11" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#080c11" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8dff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#6fd3b0" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="320" fill="#080c11"/>
  <rect width="1600" height="320" fill="url(#grid)"/>

  <!-- Base de datos -->
  <g transform="translate(120 84)" fill="none" stroke="#8ea0b2" stroke-opacity="0.5" stroke-width="2">
    <ellipse cx="60" cy="14" rx="60" ry="14"/>
    <path d="M0 14v34c0 7.7 26.9 14 60 14s60-6.3 60-14V14"/>
    <path d="M0 48v34c0 7.7 26.9 14 60 14s60-6.3 60-14V48"/>
    <path d="M0 82v34c0 7.7 26.9 14 60 14s60-6.3 60-14V82"/>
  </g>
  <circle cx="180" cy="112" r="4" fill="#4f8dff" filter="url(#glow)"/>

  <!-- Rack de servidores -->
  <g transform="translate(360 70)" fill="none" stroke="#8ea0b2" stroke-opacity="0.45" stroke-width="2">
    <rect x="0" y="0" width="150" height="46" rx="6"/>
    <rect x="0" y="56" width="150" height="46" rx="6"/>
    <rect x="0" y="112" width="150" height="46" rx="6"/>
    <path d="M18 23h54M18 79h54M18 135h54" stroke-opacity="0.3"/>
    <circle cx="122" cy="23" r="4" fill="#6fd3b0" stroke="none" opacity="0.8"/>
    <circle cx="122" cy="79" r="4" fill="#6fd3b0" stroke="none" opacity="0.55"/>
    <circle cx="122" cy="135" r="4" fill="#4f8dff" stroke="none" opacity="0.7"/>
  </g>

  <!-- Grafo de servicios -->
  <g stroke="#4f8dff" stroke-opacity="0.28" stroke-width="1.5" fill="none">
    <path d="M640 150h90M790 150h90M960 110l70 40M960 190l70-40"/>
    <path d="M730 150V96M730 150v54"/>
  </g>
  <g fill="#0b1119" stroke="#4f8dff" stroke-width="2">
    <circle cx="730" cy="150" r="16"/>
    <circle cx="730" cy="86" r="10"/>
    <circle cx="730" cy="214" r="10"/>
    <circle cx="880" cy="150" r="12"/>
    <circle cx="1030" cy="106" r="9"/>
    <circle cx="1030" cy="196" r="9"/>
  </g>
  <circle cx="730" cy="150" r="5" fill="#4f8dff" filter="url(#glow)"/>

  <!-- Terminal / API -->
  <g transform="translate(1090 76)" stroke="#8ea0b2" stroke-opacity="0.4" fill="none" stroke-width="2">
    <rect x="0" y="0" width="330" height="168" rx="10"/>
    <path d="M0 36h330" stroke-opacity="0.3"/>
    <circle cx="22" cy="18" r="4" fill="#8ea0b2" stroke="none" opacity="0.6"/>
    <circle cx="38" cy="18" r="4" fill="#8ea0b2" stroke="none" opacity="0.4"/>
    <circle cx="54" cy="18" r="4" fill="#8ea0b2" stroke="none" opacity="0.25"/>
  </g>
  <g transform="translate(1114 62)">
    <rect x="0" y="0" width="70" height="8" rx="4" fill="#4f8dff" opacity="0.75"/>
    <rect x="0" y="30" width="210" height="8" rx="4" fill="#8ea0b2" opacity="0.28"/>
    <rect x="0" y="52" width="150" height="8" rx="4" fill="#8ea0b2" opacity="0.22"/>
    <rect x="0" y="74" width="250" height="8" rx="4" fill="#6fd3b0" opacity="0.35"/>
    <rect x="0" y="96" width="120" height="8" rx="4" fill="#8ea0b2" opacity="0.2"/>
    <rect x="0" y="118" width="190" height="8" rx="4" fill="#4f8dff" opacity="0.3"/>
  </g>

  <!-- Paquetes / tráfico -->
  <g fill="#4f8dff" opacity="0.5">
    <rect x="520" y="42" width="6" height="6" rx="1"/>
    <rect x="572" y="238" width="6" height="6" rx="1"/>
    <rect x="1004" y="52" width="6" height="6" rx="1"/>
    <rect x="1520" y="120" width="6" height="6" rx="1"/>
    <rect x="300" y="250" width="6" height="6" rx="1"/>
  </g>
  <g stroke="#4f8dff" stroke-opacity="0.18" stroke-width="1">
    <path d="M120 250h220M420 246h180M700 250h240"/>
  </g>

  <rect width="1600" height="320" fill="url(#fade)"/>
</svg>
